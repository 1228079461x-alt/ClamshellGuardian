name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Policy tests
        run: swift run ClamshellGuardianPolicyTests
      - name: Build arm64 application bundle
        run: ./scripts/build.sh "$RUNNER_TEMP/clamshellguardian-output"
